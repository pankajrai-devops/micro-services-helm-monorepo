apiVersion: v1
kind: Service
metadata:
  name: postgres-write-primary
  namespace: {{ .Values.global.namespace }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    statefulset.kubernetes.io/pod-name: postgres-db-0
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-read-pool
  namespace: {{ .Values.global.namespace }}
spec:
  ports:
    - port: 5432
      targetPort: 5432
  selector:
    app: postgres-db
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-headless
  namespace: {{ .Values.global.namespace }}
spec:
  clusterIP: None
  ports:
    - port: 5432
      name: db-port
  selector:
    app: postgres-db
