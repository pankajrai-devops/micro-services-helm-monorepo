apiVersion: v1
kind: Service
metadata:
  name: tomcat-service
  namespace: {{ .Values.global.namespace }}
spec:
  type: {{ .Values.tomcat.service.type }}
  ports:
    - port: 8080
      targetPort: 8080
      {{- if eq .Values.tomcat.service.type "NodePort" }}
      nodePort: {{ .Values.tomcat.service.nodePort }}
      {{- end }}
  selector:
    app: tomcat-app
